services:
  - type: web
    name: resume-parser-pro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DB_NAME
        value: resume_parser
      - key: MONGODB_URI
        sync: false
